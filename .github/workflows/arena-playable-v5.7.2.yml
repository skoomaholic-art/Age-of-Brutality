name: Current Arena V5.7.2 DEV

on:
  push:
    branches: [main]
    paths:
      - 'arena/source/current/**'
      - 'tools/build_arena_v5_7_2.js'
      - 'tools/build_intrigue_cards_v5_7_2.js'
      - 'tools/generate_card_registry_v5_7_2.js'
      - 'tools/check_territory_metadata_v5_7_2.py'
      - 'qa/game-master/**'
      - 'qa/rules/**'
      - 'ai/**'
      - 'data/**'
      - 'cards/**'
      - 'map/**'
      - 'rules/source/**'
      - '.github/workflows/arena-playable-v5.7.2.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Canonical consistency
        run: |
          node tools/reconcile_v5_7_2.js --check
          node tools/generate_card_registry_v5_7_2.js --check
          node tools/check_map_topology_v5_7_2.js
          node tools/check_ai_config_v5_7_2.js
          python3 tools/check_territory_metadata_v5_7_2.py
          node tools/check_tabletop_integrity_v5_7_2.js
      - name: Runtime syntax
        run: |
          cat arena/source/current/recovery/engine_runtime_recovered_prefix.js arena/source/current/engine_runtime_tail.part-00.js arena/source/current/engine_runtime_tail.part-01.js arena/source/current/engine_runtime_tail.part-02.js > /tmp/engine_runtime_current.js
          node --check arena/source/current/ai_adapter.js
          node --check /tmp/engine_runtime_current.js
          node --check arena/source/current/current_parity_patch.js
          node --check arena/source/current/physical_components_patch.js
          node --check arena/source/current/intrigue_runtime_patch.js
          node --check arena/source/current/diplomacy_runtime_patch.js
          node --check arena/source/current/ui_runtime.js
          node --check tools/build_arena_v5_7_2.js
          node --check tools/build_intrigue_cards_v5_7_2.js
          node --check tools/check_tabletop_integrity_v5_7_2.js
          node --check qa/game-master/game_master_runner.js
          node --check qa/rules/tabletop_components.test.js
          node --check qa/rules/current_engine_invariants.test.js
          node --check qa/rules/current_ui_smoke.test.js
      - name: House AI tests
        run: node ai/tests/house_agents.test.js
      - name: Build current Arena and physical Intrigues
        run: |
          node tools/build_arena_v5_7_2.js
          node tools/build_intrigue_cards_v5_7_2.js
      - name: Tabletop component tests
        run: |
          node qa/rules/tabletop_components.test.js
          node qa/rules/current_engine_invariants.test.js
          node qa/rules/current_ui_smoke.test.js
      - name: Game Master raw 100-seed regression
        run: |
          rm -rf qa/reports/current && mkdir -p qa/reports/current/raw_100
          node qa/game-master/game_master_runner.js arena/builds/V5.7.2_PLAYABLE_CURRENT_DEV.html 100 57001 qa/reports/current/raw_100 > qa/reports/current/Game_Master_Summary_V5.7.2_CURRENT_100seeds.json
          python3 - <<'PY'
          import json
          x=json.load(open('qa/reports/current/Game_Master_Summary_V5.7.2_CURRENT_100seeds.json',encoding='utf-8'));s=x['structural'];m=x['coverage']['metrics']
          assert s['finished']==100 and s['round6']==100 and s['actions108']==100 and s['errorGames']==0 and s['invalid']==0,s
          assert not x['capabilities'].get('sourceBlockedActions'),x['capabilities']
          assert m.get('intrigueDraws',0)>0 and m.get('intriguePlays',0)>0 and m.get('tracesCreated',0)>0 and m.get('investigations',0)>0,m
          blocking=[f for f in x['findings'] if f['severity'] in ('HIGH','CRITICAL')];assert not blocking,blocking
          print('100 seeds structural OK',s);print('metrics',m);print('houses',x['houseSummary']);print('findings',x['findings'])
          PY
      - name: Game Master 500-seed balance regression
        run: |
          node qa/game-master/game_master_runner.js arena/builds/V5.7.2_PLAYABLE_CURRENT_DEV.html 500 58001 > qa/reports/current/Game_Master_Summary_V5.7.2_CURRENT_500seeds.json
          python3 - <<'PY'
          import json
          x=json.load(open('qa/reports/current/Game_Master_Summary_V5.7.2_CURRENT_500seeds.json',encoding='utf-8'));s=x['structural'];m=x['coverage']['metrics']
          assert s['finished']==500 and s['round6']==500 and s['actions108']==500 and s['errorGames']==0 and s['invalid']==0,s
          assert not x['capabilities'].get('sourceBlockedActions'),x['capabilities']
          assert m.get('intrigueDraws',0)>0 and m.get('intriguePlays',0)>0 and m.get('investigations',0)>0,m
          blocking=[f for f in x['findings'] if f['severity'] in ('HIGH','CRITICAL')];assert not blocking,blocking
          print('500 seeds structural OK',s);print('metrics',m);print('houses',x['houseSummary']);print('findings',x['findings'])
          PY
      - name: Package inspectable current Arena
        run: |
          rm -rf release/generated/V5.7.2-PLAYABLE-CURRENT-DEV && mkdir -p release/generated/V5.7.2-PLAYABLE-CURRENT-DEV
          cp arena/builds/V5.7.2_PLAYABLE_CURRENT_DEV.html arena/builds/V5.7.2_PLAYABLE_CURRENT_DEV.manifest.json release/generated/V5.7.2-PLAYABLE-CURRENT-DEV/
          cp cards/generated/Zhestokiy_Vek_Intrigues_V5.7.2_40.html release/generated/V5.7.2-PLAYABLE-CURRENT-DEV/
          cp qa/reports/current/Game_Master_Summary_V5.7.2_CURRENT_100seeds.json qa/reports/current/Game_Master_Summary_V5.7.2_CURRENT_500seeds.json release/generated/V5.7.2-PLAYABLE-CURRENT-DEV/
          cp -r qa/reports/current/raw_100 release/generated/V5.7.2-PLAYABLE-CURRENT-DEV/
          zip -qr release/generated/V5.7.2-PLAYABLE-CURRENT-DEV/Zhestokiy_Vek_V5.7.2_PLAYABLE_CURRENT_DEV_FULL.zip README.md CHANGELOG.md VERSION RELEASE_MANIFEST.md rules data ai map cards components arena/source arena/builds qa/game-master qa/rules qa/reports/current tools
          find release/generated/V5.7.2-PLAYABLE-CURRENT-DEV -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > release/generated/V5.7.2-PLAYABLE-CURRENT-DEV/SHA256SUMS.txt
      - name: Validate tracked diff
        run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: Zhestokiy_Vek_V5.7.2_PLAYABLE_CURRENT_DEV
          path: release/generated/V5.7.2-PLAYABLE-CURRENT-DEV/
          if-no-files-found: error
          retention-days: 30
