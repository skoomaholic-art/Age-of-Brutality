name: Assemble staged PDF artifact

on:
  push:
    branches:
      - main
    paths:
      - '.pdf-staging/manifest.json'

permissions:
  contents: write

jobs:
  assemble-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify PDF
        shell: bash
        run: |
          if [ ! -f .pdf-staging/manifest.json ]; then
            echo "No staging manifest in this revision; nothing to assemble."
            exit 0
          fi
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, shutil
          manifest_path = pathlib.Path('.pdf-staging/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          target = pathlib.Path(manifest['target'])
          parts_dir = pathlib.Path(manifest.get('parts_dir', '.pdf-staging/parts'))
          parts = sorted(parts_dir.glob('*.b64'))
          if not parts:
              raise SystemExit('No PDF base64 parts found')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(data).hexdigest()
          expected = manifest['sha256'].lower()
          if actual != expected:
              raise SystemExit(f'SHA-256 mismatch: {actual} != {expected}')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          if not data.startswith(b'%PDF-'):
              raise SystemExit('Assembled artifact is not a PDF')
          shutil.rmtree('.pdf-staging')
          print(f'Assembled {target} ({len(data)} bytes, sha256={actual})')
          PY

      - name: Commit assembled artifact
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: assemble staged PDF artifact"
          git push
