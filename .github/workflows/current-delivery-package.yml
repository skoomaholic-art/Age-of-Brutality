name: Current full board game delivery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/current-delivery-package.yml'
      - 'VERSION'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'RELEASE_MANIFEST.md'
      - 'rules/**'
      - 'data/**'
      - 'cards/**'
      - 'map/**'
      - 'arena/**'
      - 'ai/**'
      - 'qa/**'
      - 'visual/**'
      - 'components/**'
      - 'docs/**'
      - 'release/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install recovery PDF dependencies
        run: |
          python -m pip install --disable-pip-version-check reportlab pypdf pillow
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y poppler-utils fonts-dejavu-core >/dev/null

      - name: Regenerate current reproducible materials
        run: |
          python tools/build_recovery_artifacts_v5_7_2.py
          python tools/check_recovery_artifacts_v5_7_2.py

      - name: Assemble current delivery
        run: python tools/package_current_delivery.py

      - name: Upload full current package
        uses: actions/upload-artifact@v4
        with:
          name: zv-v5.7.2-current-full-package
          path: |
            delivery/Жестокий_Век_V5.7.2_CURRENT_FULL_PACKAGE.zip
            delivery/SHA256.txt
          if-no-files-found: error
          retention-days: 30
