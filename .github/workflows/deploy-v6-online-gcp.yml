name: Deploy Age of Brutality V6 Online to Google Cloud Run

on:
  push:
    branches:
      - feature/v6-persistent-prototype
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: age-of-brutality-v6-gcp
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Deploy Age of Brutality V6') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v6
    env:
      PROJECT_ID: ${{ vars.AOB_GCP_PROJECT_ID }}
      REGION: ${{ vars.AOB_GCP_REGION || 'europe-west1' }}
      SERVICE: age-of-brutality-v6
      WIF_PROVIDER: ${{ vars.AOB_GCP_WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.AOB_GCP_DEPLOY_SA }}
      RUNTIME_SA: ${{ vars.AOB_GCP_RUNTIME_SA }}
      FIRESTORE_DATABASE: "(default)"
      FIRESTORE_LOCATION: europe-west1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run V6 checks before deploying
        run: |
          set -euo pipefail
          npm run check
          node tools/check-browser-html.mjs

      - name: Require dedicated game cloud config
        run: |
          set -euo pipefail
          test -n "${PROJECT_ID}"
          test -n "${WIF_PROVIDER}"
          test -n "${DEPLOY_SA}"
          test -n "${RUNTIME_SA}"

      - id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify Firestore API
        run: |
          set -euo pipefail
          ENABLED="$(gcloud services list \
            --project="${PROJECT_ID}" \
            --enabled \
            --filter='config.name:firestore.googleapis.com' \
            --format='value(config.name)')"
          if [[ "${ENABLED}" != "firestore.googleapis.com" ]]; then
            echo "Firestore API is not enabled in project ${PROJECT_ID}."
            echo "Run the one-time Firestore bootstrap as a project owner, then redeploy."
            exit 1
          fi
          echo "Firestore API is enabled."

      - name: Snapshot live game before deploy
        run: |
          set -euo pipefail
          SNAPSHOT_FILE="/tmp/aob-predeploy-snapshot.json"
          LEGACY_STATE_FILE="/tmp/aob-predeploy-state.json"
          HAVE_SNAPSHOT=0

          OLD_URL="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)' 2>/dev/null || true)"

          if [[ -n "${OLD_URL}" ]]; then
            if curl -fsS --max-time 20 "${OLD_URL}/api/snapshot" -o "${SNAPSHOT_FILE}"; then
              HAVE_SNAPSHOT=1
              echo "Captured snapshot from /api/snapshot."
            elif curl -fsS --max-time 20 "${OLD_URL}/api/state" -o "${LEGACY_STATE_FILE}"; then
              jq '{schema_version:1,saved_at:(now|todateiso8601),game:.game}' \
                "${LEGACY_STATE_FILE}" > "${SNAPSHOT_FILE}"
              HAVE_SNAPSHOT=1
              echo "Captured legacy game state from /api/state."
            else
              echo "Live service found, but no snapshot could be captured."
            fi
          else
            echo "No existing Cloud Run service yet."
          fi

          echo "HAVE_SNAPSHOT=${HAVE_SNAPSHOT}" >> "${GITHUB_ENV}"
          echo "SNAPSHOT_FILE=${SNAPSHOT_FILE}" >> "${GITHUB_ENV}"

      - name: Deploy prototype
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --source=. \
            --service-account="${RUNTIME_SA}" \
            --no-invoker-iam-check \
            --ingress=all \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=1 \
            --memory=256Mi \
            --concurrency=40 \
            --cpu-throttling \
            --set-env-vars="AOB_FIRESTORE_DATABASE=${FIRESTORE_DATABASE},AOB_GAME_ID=prototype-1,AOB_BUILD_SHA=${GITHUB_SHA}" \
            --quiet

          URL="$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          test -n "${URL}"

          echo "URL=${URL}" >> "${GITHUB_ENV}"
          echo "### Age of Brutality V6 Online" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Project: ${PROJECT_ID}" >> "${GITHUB_STEP_SUMMARY}"
          echo "URL: ${URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Commit: ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Migrate pre-Firestore game once
        if: ${{ env.HAVE_SNAPSHOT == '1' }}
        run: |
          set -euo pipefail
          test -s "${SNAPSHOT_FILE}"

          STORAGE_STATUS="$(curl --retry 8 --retry-all-errors --retry-delay 2 \
            -fsS --max-time 30 "${URL}/api/storage")"

          BACKEND="$(printf '%s' "${STORAGE_STATUS}" | jq -r '.backend')"
          LOADED_EXISTING="$(printf '%s' "${STORAGE_STATUS}" | jq -r '.loaded_existing_at_startup')"

          test "${BACKEND}" = "firestore"

          if [[ "${LOADED_EXISTING}" == "false" ]]; then
            curl --retry 8 --retry-all-errors --retry-delay 2 \
              -fsS --max-time 30 \
              -X POST \
              -H 'content-type: application/json' \
              --data-binary "@${SNAPSHOT_FILE}" \
              "${URL}/api/snapshot/restore"
            echo
            echo "Legacy live game migrated into Firestore."
          else
            echo "Firestore already contained the live game. Migration restore skipped."
          fi

      - name: Smoke check
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 \
            -fsS --max-time 20 "${URL}/api/state" >/dev/null
          curl -fsS --max-time 20 "${URL}/api/snapshot" >/dev/null
          curl -fsS --max-time 20 "${URL}/api/storage" | jq -e '.backend == "firestore"' >/dev/null
          curl -fsS --max-time 20 "${URL}/" >/dev/null
          echo "Cloud Run prototype is reachable and Firestore is the active backend."
