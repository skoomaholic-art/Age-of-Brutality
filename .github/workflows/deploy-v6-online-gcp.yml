name: Deploy Age of Brutality V6 Online to Google Cloud Run

on:
  push:
    branches:
      - feature/v6-persistent-prototype
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: age-of-brutality-v6-gcp
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Deploy Age of Brutality V6') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v6
    env:
      PROJECT_ID: skoomaholic-poster-editor
      REGION: europe-west1
      SERVICE: age-of-brutality-v6
      WIF_PROVIDER: projects/1046342400775/locations/global/workloadIdentityPools/poster-editor-github/providers/github
      DEPLOY_SA: poster-editor-deployer@skoomaholic-poster-editor.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@v4

      - id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy prototype
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --source=. \
            --service-account="${DEPLOY_SA}" \
            --no-invoker-iam-check \
            --ingress=all \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=1 \
            --memory=256Mi \
            --concurrency=40 \
            --cpu-throttling \
            --quiet

          URL="$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          test -n "${URL}"

          echo "URL=${URL}" >> "${GITHUB_ENV}"
          echo "### Age of Brutality V6 Online" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "URL: ${URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Commit: ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Smoke check
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "${URL}/api/state" >/dev/null
          curl -fsS --max-time 20 "${URL}/" >/dev/null
          echo "Cloud Run prototype is reachable."
