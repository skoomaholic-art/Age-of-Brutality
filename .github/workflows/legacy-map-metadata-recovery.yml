name: Legacy Map Metadata Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/legacy-map-metadata-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover RC1 HTML from historical commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rc1recover
          LEGACY=4db4d910a9668abf8a75152395407936be083618
          : > /tmp/rc1recover/arena.b64
          for p in \
            arena/source/rc1/part-00.b64 \
            arena/source/rc1/part-00-tail.b64 \
            arena/source/rc1/part-01.b64 \
            arena/source/rc1/part-02.b64 \
            arena/source/rc1/part-03.b64; do
            git show "$LEGACY:$p" >> /tmp/rc1recover/arena.b64
          done
          tr -d '\r\n ' < /tmp/rc1recover/arena.b64 | base64 -d > /tmp/rc1recover/arena.gz
          gzip -dc /tmp/rc1recover/arena.gz > /tmp/rc1recover/arena.html 2>/tmp/rc1recover/gzip.err || true
          echo "recovered_bytes=$(wc -c < /tmp/rc1recover/arena.html)"
          cat /tmp/rc1recover/gzip.err || true

      - name: Inspect recovered payload and extract metadata if present
        id: inspect
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import json,re,sys

          html=Path('/tmp/rc1recover/arena.html').read_text(encoding='utf-8',errors='replace')
          probes=['territoryMeta','ARENA_DATA','W1-1','E3-1','resistance','village','city','wild','Capital','Сопротивление']
          diag={'recovered_chars':len(html),'positions':{p:html.find(p) for p in probes}}
          diag['head']=html[:2500]
          diag['tail']=html[-5000:]
          Path('/tmp/rc1recover/diagnostic.json').write_text(json.dumps(diag,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'recovered_chars':diag['recovered_chars'],'positions':diag['positions']},ensure_ascii=False))

          patterns=[r'"territoryMeta"\s*:', r"'territoryMeta'\s*:", r'\bterritoryMeta\s*:', r'\bterritoryMeta\s*=']
          matches=[]
          for pat in patterns:
              matches += [(m.start(),pat,m.end()) for m in re.finditer(pat,html)]
          if not matches:
              print('NO_TERRITORY_META_IN_RECOVERED_RANGE')
              sys.exit(0)
          matches.sort(); key_start,pat,key_end=matches[0]
          i=html.find('[',key_end)
          if i < 0:
              print('TERRITORY_META_WITHOUT_ARRAY_START'); sys.exit(0)
          begin=i; depth=0; quote=None; esc=False; end=None
          for j in range(i,len(html)):
              ch=html[j]
              if quote:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch==quote: quote=None
                  continue
              if ch in ('"',"'"): quote=ch; continue
              if ch=='[': depth+=1
              elif ch==']':
                  depth-=1
                  if depth==0: end=j+1; break
          if end is None:
              print('TERRITORY_META_ARRAY_INCOMPLETE'); sys.exit(0)
          raw=html[begin:end]
          try: rows=json.loads(raw)
          except Exception as exc:
              Path('/tmp/rc1recover/territoryMeta.raw.txt').write_text(raw,encoding='utf-8')
              print('TERRITORY_META_NOT_JSON',exc); sys.exit(0)
          topo=json.loads(Path('map/canonical_topology_v5.7.2.json').read_text(encoding='utf-8'))
          ids=[r.get('id') for r in rows]
          current=set(topo['territories']); legacy=set(ids)
          if len(ids)!=len(set(ids)) or current!=legacy:
              print('TERRITORY_ID_MISMATCH',len(rows),sorted(current-legacy),sorted(legacy-current)); sys.exit(0)
          out={
              'game':'Жестокий Век','status':'HISTORICAL_MIGRATION_CANDIDATE',
              'source_commit':'4db4d910a9668abf8a75152395407936be083618',
              'source':'forensic recovery from historical arena/source/rc1 compressed baseline',
              'warning':'Historical source recovered without invention. Must be cross-checked against active Rules/Data before promotion to canonical Arena input.',
              'current_topology_version':topo.get('version'),'territory_count':len(rows),'territoryMeta':rows,
          }
          Path('map/legacy_territory_metadata_rc1.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('RECOVERED_TERRITORY_META',len(rows),sorted({str(r.get('type')) for r in rows}),sorted({str(r.get('resistance')) for r in rows}))
          PY
          exit 0

      - name: Upload forensic diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: legacy-map-recovery-diagnostic
          path: /tmp/rc1recover/diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit migration candidate when found
        shell: bash
        run: |
          if [ ! -f map/legacy_territory_metadata_rc1.json ]; then
            echo 'No complete territory metadata in recovered RC1 range; diagnostic uploaded.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map/legacy_territory_metadata_rc1.json
          if git diff --cached --quiet; then
            echo 'No metadata change'
          else
            git commit -m 'map: recover legacy territory metadata candidate'
            git push
          fi
