name: Preprint reconcile generated card sources

on:
  push:
    branches:
      - preprint/html-card-v5.7.2-2026-09-11

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preprint/html-card-v5.7.2-2026-09-11
      - name: Generate registry
        run: node tools/generate_card_registry_v5_7_2.js
      - name: Reconcile HTML preprint source
        run: node tools/reconcile_card_html_v5_7_2.js
      - name: Commit generated sources if changed
        shell: bash
        run: |
          if git diff --quiet -- cards/canonical_registry_v5.7.2.json visual/html_v22/card_editor.html visual/html_v22/print_studio.html; then
            echo "Generated sources already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/canonical_registry_v5.7.2.json visual/html_v22/card_editor.html visual/html_v22/print_studio.html
          git commit -m "visual: reconcile canonical card preprint sources"
          git push origin HEAD:preprint/html-card-v5.7.2-2026-09-11
