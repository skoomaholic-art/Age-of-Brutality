name: RC3 Fragment Diagnostic (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect and reconstruct saved engine fragments
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/rc3diag qa/reports
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, hashlib
          root = Path('arena/source/current')
          files = sorted(root.glob('engine_runtime.part-*.b64'))
          out = bytearray()
          lines = ['# RC3 fragment diagnostic', '', '## Fragment integrity']
          allowed = re.compile(rb'[A-Za-z0-9+/=\r\n]')
          for f in files:
              raw = f.read_bytes()
              bad = [(i, b) for i, b in enumerate(raw) if not allowed.fullmatch(bytes([b]))]
              compact = b''.join(raw.split())
              status = 'PASS'; decoded = b''; error = ''
              try:
                  decoded = base64.b64decode(compact, validate=True)
              except Exception as exc:
                  status = 'FAIL'; error = str(exc)
                  cut = bad[0][0] if bad else len(raw)
                  prefix = b''.join(raw[:cut].split())
                  prefix = prefix[:len(prefix) - (len(prefix) % 4)]
                  try: decoded = base64.b64decode(prefix, validate=True)
                  except Exception: decoded = b''
              out.extend(decoded)
              lines += [f'- `{f.name}`: base64_bytes={len(raw)}, decoded_bytes={len(decoded)}, decode={status}',
                        f'  - invalid_byte_positions={bad[:8] if bad else []}', f'  - error={error or "none"}']
          Path('/tmp/rc3diag/per_part.js').write_bytes(out)
          lines += ['', '## Reconstructed prefix', f'- bytes={len(out)}', f'- sha256={hashlib.sha256(out).hexdigest()}']
          Path('qa/reports/RC3_FRAGMENT_DIAGNOSTIC.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Check JavaScript and audit missing methods/data sheets
        shell: bash
        run: |
          report=qa/reports/RC3_FRAGMENT_DIAGNOSTIC.md
          {
            echo
            echo '## JavaScript check'
            if node --check /tmp/rc3diag/per_part.js >/tmp/rc3diag/node.out 2>/tmp/rc3diag/node.err; then echo '- node_check=PASS'; else echo '- node_check=FAIL'; fi
            echo '```text'; cat /tmp/rc3diag/node.err || true; echo '```'
          } >> "$report"
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          src=Path('/tmp/rc3diag/per_part.js').read_text(encoding='utf-8',errors='replace')
          report=Path('qa/reports/RC3_FRAGMENT_DIAGNOSTIC.md')
          calls=set(re.findall(r'this\.([A-Za-z_$][\w$]*)\s*\(',src))
          defs=set(re.findall(r'(?m)^\s*([A-Za-z_$][\w$]*)\s*\([^\n{]*\)\s*\{',src))
          missing=sorted(calls-defs)
          mgd=json.loads(Path('data/master_game_data_v5.7.2-dev.json').read_text(encoding='utf-8'))
          sheets=mgd.get('sheets',{})
          lines=['', '## Method dependency audit', f'- declared_methods={len(defs)}', f'- called_methods={len(calls)}', f'- unresolved_this_calls={len(missing)}', '```text', *missing, '```', '', '## Master Data sheets']
          for name,rows in sheets.items(): lines.append(f'- {name}: {len(rows) if isinstance(rows,list) else "non-list"}')
          for name,rows in sheets.items():
              if not isinstance(rows,list): continue
              lname=str(name).lower()
              if 'action' in lname or 'действ' in lname:
                  lines += ['', f'### Action-like sheet: {name}', '```json', json.dumps(rows,ensure_ascii=False,indent=2), '```']
          report.write_text(report.read_text(encoding='utf-8')+'\n'.join(lines)+'\n',encoding='utf-8')
          PY
          {
            echo
            echo '## Structural markers'
            printf -- '- ArenaEngine occurrences: '; (grep -ao 'class ArenaEngine' /tmp/rc3diag/per_part.js || true) | wc -l
            printf -- '- exportData occurrences: '; (grep -ao 'exportData' /tmp/rc3diag/per_part.js || true) | wc -l
            printf -- '- window.ArenaEngine occurrences: '; (grep -ao 'window.ArenaEngine' /tmp/rc3diag/per_part.js || true) | wc -l
            printf -- '- IIFE endings: '; (grep -ao '})();' /tmp/rc3diag/per_part.js || true) | wc -l
            echo
            echo '## Tail of recovered prefix'; echo '```text'; tail -c 1200 /tmp/rc3diag/per_part.js | tr -cd '\11\12\15\40-\176' || true; echo; echo '```'
          } >> "$report"
          cat "$report"

      - name: Store forensic prefix and diagnostic report
        shell: bash
        run: |
          mkdir -p arena/source/current/recovery
          cp /tmp/rc3diag/per_part.js arena/source/current/recovery/engine_runtime_recovered_prefix.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/reports/RC3_FRAGMENT_DIAGNOSTIC.md arena/source/current/recovery/engine_runtime_recovered_prefix.js
          if git diff --cached --quiet; then echo 'Diagnostic unchanged'; else git commit -m 'qa: audit recovered RC3 engine dependencies' && git push; fi
