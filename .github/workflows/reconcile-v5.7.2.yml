name: Canonical consistency V5.7.2

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Rules/Data consistency
        run: node tools/reconcile_v5_7_2.js --check

      - name: Verify generated card registry
        run: node tools/generate_card_registry_v5_7_2.js --check

      - name: Verify canonical map topology
        run: node tools/check_map_topology_v5_7_2.js

      - name: Verify canonical AI config
        run: node tools/check_ai_config_v5_7_2.js

      - name: Run House agent tests
        run: node ai/tests/house_agents.test.js

      - name: Verify HTML card preprint source
        run: node tools/check_card_html_v5_7_2.js

      - name: Report physical card quantity audit
        run: node tools/audit_card_quantities_v5_7_2.js || true

      - name: Validate tracked diff
        run: git diff --check
