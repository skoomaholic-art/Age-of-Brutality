name: Canonical consistency V5.7.2

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Rules/Data consistency
        run: node tools/reconcile_v5_7_2.js --check

      - name: Verify generated card registry
        run: node tools/generate_card_registry_v5_7_2.js --check

      - name: Verify canonical map topology
        run: node tools/check_map_topology_v5_7_2.js

      - name: Verify canonical AI config
        run: node tools/check_ai_config_v5_7_2.js

      - name: Run House agent tests
        run: node ai/tests/house_agents.test.js

      - name: Verify current Arena reproducibility
        run: |
          node tools/build_arena_v5_7_2.js
          git diff --exit-code -- arena/builds/V5.7.2_PLAYABLE_CURRENT_DEV.html arena/builds/V5.7.2_PLAYABLE_CURRENT_DEV.manifest.json

      - name: Verify tabletop source-to-runtime integrity
        run: node tools/check_tabletop_integrity_v5_7_2.js

      - name: Verify repository completeness inventory
        run: node tools/check_repository_completeness_v5_7_2.js

      - name: Verify recovery builder syntax
        run: python -m py_compile tools/build_recovery_artifacts_v5_7_2.py tools/check_recovery_artifacts_v5_7_2.py

      - name: Verify HTML card preprint source
        run: node tools/check_card_html_v5_7_2.js

      - name: Report physical card quantity audit
        run: node tools/audit_card_quantities_v5_7_2.js || true

      - name: Validate tracked diff
        run: git diff --check
