name: V6 Core Validation

on:
  pull_request:
    paths:
      - 'v6/**'
      - '.github/workflows/v6-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate V6 core
        working-directory: v6
        run: npm run check

      - name: Validate online server syntax
        working-directory: v6
        run: |
          node --check src/online/server.mjs
          node --check src/online/firestore-store.mjs
          node --check src/online/multiplayer.mjs
          node --check src/online/profile.mjs
          node --check src/online/commands.mjs
          node --check src/online/stats.mjs
          node --check src/online/snapshot.mjs

      - name: Validate browser scripts
        working-directory: v6
        run: node tools/check-browser-html.mjs
