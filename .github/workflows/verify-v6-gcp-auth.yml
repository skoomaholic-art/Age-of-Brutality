name: Verify Age of Brutality GCP auth

on:
  push:
    branches:
      - feature/v6-persistent-prototype

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: skoomaholic-poster-editor
      WIF_PROVIDER: projects/1046342400775/locations/global/workloadIdentityPools/poster-editor-github/providers/github
      DEPLOY_SA: poster-editor-deployer@skoomaholic-poster-editor.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify read access only
        run: |
          set -euo pipefail
          gcloud projects describe "${PROJECT_ID}" --format='value(projectId)'
          gcloud run services list --project="${PROJECT_ID}" --region=europe-west1 --format='value(metadata.name)' >/dev/null
          echo "GCP authentication from Age-of-Brutality is working."
