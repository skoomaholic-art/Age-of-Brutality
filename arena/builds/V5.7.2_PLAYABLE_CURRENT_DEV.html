root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});const reset=root.querySelector('#reset');reset.onclick=()=>{const current=n(x.meta.seed)||57001,requested=Number(root.querySelector('#seed').value),seed=Number.isInteger(requested)&&requested>0&&requested!==current?requested:current+1;e.pendingPrisoner=null;e.reset(seed,6);uiNotice=`Новая партия начата · seed ${seed}`;render()};root.querySelector('#step').onclick=()=>{e.step();uiNotice=`Выполнен шаг AI · seed ${state().meta.seed}`;render()};root.querySelector('#run').onclick=()=>{e.runGame();uiNotice=`Партия завершена · seed ${state().meta.seed}`;render()};root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{e.step(b.dataset.act);render()});root.querySelectorAll('[data-free]').forEach(b=>b.onclick=()=>{const p=e.availableActions(e.currentHouse()).freeProcedures.find(x=>x.id===b.dataset.free);if(p)e.applyFreeProcedure(e.currentHouse(),p);render()});root.querySelectorAll('[data-cmd-assign]').forEach(b=>b.onclick=()=>{e.assignCommander(e.currentHouse(),b.dataset.cmdAssign);render()});root.querySelectorAll('[data-cmd-return]').forEach(b=>b.onclick=()=>{e.returnCommander(e.currentHouse(),b.dataset.cmdReturn);render()});root.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{let amount=null,response=null;if(b.dataset.pr==='ransom'){amount=Number(prompt('Выкуп N (положительное целое):','2'));response=confirm('Владелец пленника принимает выкуп?')?'accept':'reject'}e.submitPrisonerChoice(b.dataset.pr,amount,response);render()});root.querySelector('#full').onclick=()=>download(`Zhestokiy_Vek_Full_${x.meta.seed}.json`,state());root.querySelector('#journal').onclick=()=>download(`Journal_${x.meta.seed}.json`,state().logs);root.querySelector('#houses').onclick=()=>download(`Houses_${x.meta.seed}.json`,state().houses);root.querySelector('#dip').onclick=()=>download(`Diplomacy_${x.meta.seed}.json`,state().relationships);root.querySelector('#human').onchange=ev=>{for(const h of Object.keys(e.houses))e.setController(h,h===ev.target.value?'HUMAN':'AI');render()}}
render();
})();
</script></body></html>
