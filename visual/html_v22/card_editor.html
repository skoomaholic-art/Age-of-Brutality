<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Жестокий Век — Card Editor V2.2</title><style>:root{--a:#765584;--paper:#efe1ba;--ink:#302217}*{box-sizing:border-box}body{margin:0;background:#151311;color:#eee;font-family:Georgia,serif}.app{display:grid;grid-template-columns:290px 1fr 390px;height:100vh}.side{overflow:auto;background:#1c1916;padding:10px}.left{border-right:1px solid #443b34}.right{border-left:1px solid #443b34}.main{overflow:auto;background:#2b2723;padding:20px;display:flex;justify-content:center;align-items:flex-start}button,input,textarea,select{font:inherit}button{background:#302a25;color:#fff;border:1px solid #685b4e;border-radius:6px;padding:7px 9px;cursor:pointer}.primary{background:#60486d}.row{display:flex;gap:7px;flex-wrap:wrap}.search,select{width:100%;padding:7px;margin:6px 0;background:#29231f;color:#fff;border:1px solid #554a40;border-radius:5px}.item{padding:7px;border:1px solid #3d352e;border-radius:6px;margin:5px 0;cursor:pointer}.item.on{border-color:#a784bc;background:#2b2130}.small{font-size:11px;color:#c5b69f}.card{width:345px;height:470px;background:var(--paper);color:var(--ink);position:relative}.trim{position:absolute;left:15px;top:15px;width:315px;height:440px;border:2px solid #4a3222;border-radius:8px;overflow:hidden;background:#efe1ba}.head{height:60px;background:var(--a);color:#fff0cf;padding:9px 12px}.title{font-size:21px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;margin-top:4px}.art{height:160px;margin:10px 12px 8px;border:1px solid var(--a);background:#d9caa2;display:flex;align-items:center;justify-content:center;overflow:hidden}.art img{width:100%;height:100%}.meta{padding:0 12px 6px;display:flex;gap:5px;flex-wrap:wrap}.meta span{font-size:10px;border:1px solid #8b775a;border-radius:10px;padding:2px 5px}.rules{height:154px;overflow:hidden;margin:0 12px;padding:7px;border-top:1px solid #9c8968;font-size:11px;line-height:1.2}.kv{margin-bottom:4px}.k{font-weight:bold}.foot{position:absolute;left:12px;right:12px;bottom:5px;font-size:9px;display:flex;justify-content:space-between}.sec{border-bottom:1px solid #3b342e;padding:10px 0}.field{margin:7px 0}.field label{display:block;font-size:11px;color:#c9baa4;margin-bottom:3px}.field input,.field textarea,.field select{width:100%;padding:6px;background:#28231f;color:#fff;border:1px solid #564b41;border-radius:4px}.field textarea{min-height:65px}.note{font-size:11px;line-height:1.4;background:#2c251c;border:1px solid #725a34;padding:8px;border-radius:6px}.hide{display:none}@media(max-width:1050px){.app{grid-template-columns:260px 1fr}.right{position:fixed;right:0;top:0;bottom:0;width:370px;z-index:10}}@media(max-width:720px){.app{display:block}.left{height:35vh}.main{height:65vh}.right{width:100%}}</style></head><body><div class="app"><aside class="side left"><h2 style="margin:0">Card Editor V2.2</h2><div class="small">63×88 trim • 3 мм bleed • canonical registry</div><div class="row" style="margin-top:8px"><button class="primary" id="open">Открыть JSON</button><button id="canonical">Canonical</button><input id="file" type="file" accept=".json" class="hide"></div><select id="sheet"><option value="">Все группы</option></select><input id="q" class="search" placeholder="Поиск"><div id="list"></div></aside><main class="main"><div class="card"><div class="trim"><div class="head"><div class="title" id="pt">ЖЕСТОКИЙ ВЕК</div><div class="sub" id="ps">загрузите registry</div></div><div class="art" id="art"><span id="ph">ART SLOT</span><img id="img" class="hide" alt=""></div><div class="meta" id="meta"></div><div class="rules" id="rules"></div><div class="foot"><span id="pid">—</span><span id="pg">—</span></div></div></div></main><aside class="side right"><div class="row"><button id="save">Сохранить</button><button id="project">Project JSON</button><button id="registry">Registry JSON</button></div><div class="sec"><label><input type="checkbox" id="unlock"> Разрешить правку игровых полей</label><div class="note" style="margin-top:6px">Игровые поля заблокированы по умолчанию. После их изменения нужна синхронизация MGD → Rules → Card Registry.</div></div><div class="sec"><h3>Визуал</h3><div class="field"><label>Accent</label><input type="color" id="accent" value="#765584"></div><div class="field"><label>Изображение</label><input id="image" type="file" accept="image/*"></div><div class="field"><label>Fit</label><select id="fit"><option>cover</option><option>contain</option></select></div><div class="field"><label>X</label><input id="x" type="range" min="0" max="100" value="50"></div><div class="field"><label>Y</label><input id="y" type="range" min="0" max="100" value="50"></div><button id="delimg">Удалить изображение</button></div><div class="sec"><h3>Поля</h3><div id="fields"></div></div></aside></div><script>(()=>{"use strict";const $=s=>document.querySelector(s),IDS=["CARD_ID","AMBITION_ID","CHARACTER_ID","HOUSE_ID","ID"],TIT=["Название","Имя","NAME","Name","TITLE","Title","Тип","Дом"],SUB=["Категория","Тип","Дом","HOUSE","ROLE","Роль"],HC={"Варкайр":"#7c8792","Сайрвен":"#718c3f","Ортайн":"#a9762f","Эркай":"#765584","Тасвар":"#9f4139","Айрель":"#3f7776"};let P=null,I=-1,D=new Set;const esc=s=>String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));function id(r,f=""){for(const k of IDS)if(r?.[k]!==undefined&&r[k]!=="")return String(r[k]);return f}function title(r){for(const k of TIT)if(r?.[k])return String(r[k]);return id(r,"Без названия")}function sub(r,s){const t=title(r);for(const k of [...SUB,"Правитель"])if(r?.[k]&&String(r[k])!==t)return String(r[k]);return s}function ac(s,r){const h=[r?.Дом,r?.HOUSE,r?.Фракция].find(Boolean);if(HC[h])return HC[h];s=String(s).toLowerCase();if(/event|собы/.test(s))return"#765584";if(/intrig|интриг/.test(s))return"#9f4139";if(/advisor|adviser|совет/.test(s))return"#718c3f";if(/ambition|амби/.test(s))return"#a9762f";if(/house|дом/.test(s))return"#3f7776";return"#7c8792"}function norm(x){if(x?.format==="zv-card-project-v1"&&Array.isArray(x.cards))return x;if(!x?.sheets)throw Error("Нужен canonical registry или Project JSON");const cards=[];for(const[s,rows]of Object.entries(x.sheets))if(Array.isArray(rows))rows.forEach((r,n)=>cards.push({uid:`${s}::${id(r,n)}::${n}`,sheet:s,data:JSON.parse(JSON.stringify(r)),visual:{accent:ac(s,r),image:"",fit:"cover",x:50,y:50}}));return{format:"zv-card-project-v1",game:x.game||"Жестокий Век",version:x.version||"V5.7.2",source:x.source||"cards/canonical_registry_v5.7.2.json",cards}}function set(x){P=norm(x);I=P.cards.length?0:-1;D.clear();const sh=$("#sheet");sh.innerHTML='<option value="">Все группы</option>';[...new Set(P.cards.map(c=>c.sheet))].sort().forEach(s=>sh.insertAdjacentHTML("beforeend",`<option>${esc(s)}</option>`));list();show()}function filtered(){if(!P)return[];const q=$("#q").value.toLowerCase(),s=$("#sheet").value;return P.cards.map((c,i)=>[c,i]).filter(([c])=>(!s||c.sheet===s)&&(!q||(c.sheet+id(c.data)+title(c.data)+JSON.stringify(c.data)).toLowerCase().includes(q))).map(x=>x[1])}function list(){const b=$("#list");b.innerHTML="";if(!P){b.innerHTML='<p class="small">Загрузите JSON.</p>';return}filtered().forEach(i=>{const c=P.cards[i],d=document.createElement("div");d.className="item"+(i===I?" on":"");d.innerHTML=`<b>${esc(title(c.data))}</b><div class="small">${esc(c.sheet)} • ${esc(id(c.data,c.uid))}${D.has(c.uid)?" • изменено":""}</div>`;d.onclick=()=>{I=i;list();show()};b.appendChild(d)})}function show(){if(!P||I<0)return;const c=P.cards[I],r=c.data,v=c.visual||{};document.documentElement.style.setProperty("--a",v.accent||ac(c.sheet,r));$("#accent").value=v.accent||ac(c.sheet,r);$("#fit").value=v.fit||"cover";$("#x").value=v.x??50;$("#y").value=v.y??50;$("#pt").textContent=title(r);$("#ps").textContent=sub(r,c.sheet);$("#pid").textContent=id(r,c.uid);$("#pg").textContent=c.sheet;const im=$("#img"),ph=$("#ph");if(v.image){im.src=v.image;im.classList.remove("hide");ph.classList.add("hide");im.style.objectFit=v.fit||"cover";im.style.objectPosition=`${v.x??50}% ${v.y??50}%`}else{im.classList.add("hide");ph.classList.remove("hide")}const mk=["Категория","Тип","Дом","Длительность","Цель","Модификатор","Роль","ROLE"],m=$("#meta");m.innerHTML="";mk.forEach(k=>{if(r[k]!==undefined&&r[k]!=="")m.insertAdjacentHTML("beforeend",`<span>${esc(r[k])}</span>`)});const hid=new Set([...IDS,...TIT,...mk,"Power Budget"]),rr=$("#rules");rr.innerHTML="";Object.entries(r).filter(([k,v])=>!hid.has(k)&&v!==""&&v!=null).forEach(([k,v])=>rr.insertAdjacentHTML("beforeend",`<div class="kv"><span class="k">${esc(k)}:</span> ${esc(typeof v==="object"?JSON.stringify(v):v)}</div>`));fields(c)}function fields(c){const b=$("#fields");b.innerHTML="";const u=$("#unlock").checked;Object.entries(c.data).forEach(([k,v])=>{const w=document.createElement("div");w.className="field";w.innerHTML=`<label>${esc(k)}</label>`;const long=String(v??"").length>55||/эффект|опис|правил|услов|запрет|text|effect/i.test(k),inp=document.createElement(long?"textarea":"input");if(!long&&typeof v==="number")inp.type="number";inp.value=typeof v==="object"?JSON.stringify(v):String(v??"");inp.disabled=!u;inp.onchange=()=>{if(!u)return;let z=inp.value;if(typeof v==="number"){const n=Number(z);if(Number.isFinite(n))z=n}else if(typeof v==="object"){try{z=JSON.parse(z)}catch(e){alert("Ошибка JSON в поле "+k);return}}c.data[k]=z;D.add(c.uid);show();list()};w.appendChild(inp);b.appendChild(w)})}function dl(n,t){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function dirty(c){D.add(c.uid);list()}$("#open").onclick=()=>$("#file").click();$("#file").onchange=async e=>{try{set(JSON.parse(await e.target.files[0].text()))}catch(x){alert(x.message)}};$("#canonical").onclick=async()=>{for(const u of["../../cards/canonical_registry_v5.7.2.json","./canonical_registry_v5.7.2.json"]){try{const r=await fetch(u,{cache:"no-store"});if(r.ok){set(await r.json());return}}catch(e){}}alert("Откройте canonical_registry_v5.7.2.json вручную")};$("#q").oninput=list;$("#sheet").onchange=list;$("#unlock").onchange=show;$("#accent").oninput=e=>{if(!P||I<0)return;const c=P.cards[I];c.visual.accent=e.target.value;dirty(c);show()};$("#fit").onchange=e=>{const c=P.cards[I];c.visual.fit=e.target.value;dirty(c);show()};$("#x").oninput=e=>{const c=P.cards[I];c.visual.x=+e.target.value;dirty(c);show()};$("#y").oninput=e=>{const c=P.cards[I];c.visual.y=+e.target.value;dirty(c);show()};$("#image").onchange=e=>{const f=e.target.files[0];if(!f||!P||I<0)return;const R=new FileReader;R.onload=()=>{const c=P.cards[I];c.visual.image=R.result;dirty(c);show()};R.readAsDataURL(f)};$("#art").ondblclick=()=>$("#image").click();$("#delimg").onclick=()=>{const c=P.cards[I];c.visual.image="";dirty(c);show()};$("#save").onclick=()=>{try{localStorage.setItem("zv_card_v22",JSON.stringify(P));alert("Сохранено") }catch(e){alert(e.message)}};$("#project").onclick=()=>P&&dl("Жестокий_Век_Card_Project_V5.7.2.json",JSON.stringify(P,null,2));$("#registry").onclick=()=>{if(!P)return;const sheets={};P.cards.forEach(c=>(sheets[c.sheet]||(sheets[c.sheet]=[])).push(c.data));dl("canonical_registry_v5.7.2_EDITED.json",JSON.stringify({game:P.game,version:P.version,status:"EDITED_FROM_CANONICAL_CARD_REGISTRY",source:P.source,sheets},null,2))};try{const s=localStorage.getItem("zv_card_v22");if(s)set(JSON.parse(s))}catch(e){}})();</script></body></html>
