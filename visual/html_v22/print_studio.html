<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Жестокий Век — Card Print Studio V2.2</title><style>:root{--a:#765584}*{box-sizing:border-box}body{margin:0;background:#1b1917;color:#eee;font-family:Georgia,serif}.bar{position:sticky;top:0;z-index:20;background:#181614;border-bottom:1px solid #443b34;padding:9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;background:#302a25;color:#fff;border:1px solid #66584d;border-radius:5px;padding:7px 9px}button{cursor:pointer}.primary{background:#5d466a}.bar select{min-width:180px}.stat{margin-left:auto;font-size:12px;color:#c9baa3}#pages{padding:18px}.page{width:210mm;height:297mm;background:#fff;margin:0 auto 18px;display:grid;grid-template-columns:repeat(3,69mm);grid-template-rows:repeat(3,94mm);align-content:center;justify-content:center;box-shadow:0 5px 30px #0008}.slot{width:69mm;height:94mm;position:relative;overflow:hidden;background:#efe1ba;color:#302217;cursor:pointer}.slot.off{opacity:.28;filter:grayscale(.6)}.slot.blank{background:#fff;cursor:default}.trimline{position:absolute;left:3mm;top:3mm;width:63mm;height:88mm;border:.2mm dashed #5b473780;z-index:9;pointer-events:none}.card{position:absolute;left:3mm;top:3mm;width:63mm;height:88mm;border:.35mm solid #4a3222;border-radius:1.6mm;overflow:hidden;background:#efe1ba}.head{height:12mm;background:var(--a);color:#fff0cf;padding:1.5mm 2mm}.title{font-size:4mm;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:2mm;margin-top:.6mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.art{height:30mm;margin:2mm 2.5mm 1.5mm;border:.25mm solid var(--a);background:#d9caa2;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:2.2mm;color:#715b42}.art img{width:100%;height:100%}.meta{height:8mm;padding:0 2.5mm;display:flex;gap:1mm;flex-wrap:wrap;overflow:hidden}.meta span{font-size:1.8mm;border:.2mm solid #90795a;border-radius:2mm;padding:.4mm 1mm}.rules{height:30mm;overflow:hidden;margin:0 2.5mm;padding:1.3mm 1.1mm;border-top:.2mm solid #9c8968;font-size:2mm;line-height:1.18}.kv{margin-bottom:.7mm}.k{font-weight:bold}.foot{position:absolute;left:2.5mm;right:2.5mm;bottom:1.1mm;display:flex;justify-content:space-between;font-size:1.7mm}.noguide .trimline{display:none}.empty{max-width:760px;margin:60px auto;padding:24px;border:1px solid #5a4d42;border-radius:10px;text-align:center;color:#c9baa3}@page{size:A4;margin:0}@media print{body{background:#fff}.bar{display:none}#pages{padding:0}.page{margin:0;box-shadow:none;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}.slot.off{display:none}}</style></head><body><div class="bar"><button class="primary" id="open">Открыть JSON</button><button id="canonical">Canonical</button><input id="file" type="file" accept=".json" hidden><select id="sheet"><option value="">Все группы</option></select><label><input id="guides" type="checkbox" checked> trim guides</label><label><input id="only" type="checkbox"> только выбранные</label><button id="all">Все</button><button id="none">Снять</button><button id="print">Печать/PDF</button><span class="stat" id="stat">данные не загружены</span></div><div id="pages"><div class="empty"><h2>Card Print Studio V2.2</h2><p>Импортируйте canonical registry или Project JSON.</p><p>69×94 мм full / 63×88 мм trim / 3 мм bleed / A4 3×3.</p></div></div><script>(()=>{"use strict";const $=s=>document.querySelector(s),IDS=["CARD_ID","AMBITION_ID","CHARACTER_ID","HOUSE_ID","ID"],TIT=["Название","Имя","NAME","Name","TITLE","Title"],SUB=["Категория","Тип","Дом","HOUSE","ROLE","Роль"],HC={"Варкайр":"#7c8792","Сайрвен":"#718c3f","Ортайн":"#a9762f","Эркай":"#765584","Тасвар":"#9f4139","Айрель":"#3f7776"};let P=null,S=new Set;const esc=s=>String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));function id(r,f=""){for(const k of IDS)if(r?.[k]!==undefined&&r[k]!=="")return String(r[k]);return f}function title(r){for(const k of TIT)if(r?.[k])return String(r[k]);return id(r,"Без названия")}function sub(r,s){for(const k of SUB)if(r?.[k])return String(r[k]);return s}function ac(s,r){const h=[r?.Дом,r?.HOUSE,r?.Фракция].find(Boolean);if(HC[h])return HC[h];s=String(s).toLowerCase();if(/event|собы/.test(s))return"#765584";if(/intrig|интриг/.test(s))return"#9f4139";if(/advisor|adviser|совет/.test(s))return"#718c3f";if(/ambition|амби/.test(s))return"#a9762f";if(/house|дом/.test(s))return"#3f7776";return"#7c8792"}function norm(x){if(x?.format==="zv-card-project-v1"&&Array.isArray(x.cards))return x;if(!x?.sheets)throw Error("Нужен canonical registry или Project JSON");const cards=[];for(const[s,rows]of Object.entries(x.sheets))if(Array.isArray(rows))rows.forEach((r,n)=>cards.push({uid:`${s}::${id(r,n)}::${n}`,sheet:s,data:r,visual:{accent:ac(s,r),image:"",fit:"cover",x:50,y:50}}));return{format:"zv-card-project-v1",game:x.game||"Жестокий Век",version:x.version||"V5.7.2",cards}}function set(x){P=norm(x);S=new Set(P.cards.map(c=>c.uid));const sh=$("#sheet");sh.innerHTML='<option value="">Все группы</option>';[...new Set(P.cards.map(c=>c.sheet))].sort().forEach(s=>sh.insertAdjacentHTML("beforeend",`<option>${esc(s)}</option>`));render()}function card(c){const r=c.data,v=c.visual||{},a=v.accent||ac(c.sheet,r),mk=["Категория","Тип","Дом","Длительность","Цель","Модификатор","Роль","ROLE"],hid=new Set([...IDS,...TIT,...mk,"Power Budget"]),meta=mk.filter(k=>r[k]!==undefined&&r[k]!=="").map(k=>`<span>${esc(r[k])}</span>`).join(""),rules=Object.entries(r).filter(([k,z])=>!hid.has(k)&&z!==""&&z!=null).map(([k,z])=>`<div class="kv"><span class="k">${esc(k)}:</span> ${esc(typeof z==="object"?JSON.stringify(z):z)}</div>`).join(""),im=v.image?`<img src="${v.image}" style="object-fit:${v.fit||"cover"};object-position:${v.x??50}% ${v.y??50}%">`:"ART SLOT";return`<div class="slot${S.has(c.uid)?"":" off"}" data-u="${esc(c.uid)}" style="--a:${a}"><div class="trimline"></div><div class="card"><div class="head"><div class="title">${esc(title(r))}</div><div class="sub">${esc(sub(r,c.sheet))}</div></div><div class="art">${im}</div><div class="meta">${meta}</div><div class="rules">${rules}</div><div class="foot"><span>${esc(id(r,c.uid))}</span><span>${esc(c.sheet)}</span></div></div></div>`}function render(){if(!P)return;const sf=$("#sheet").value,only=$("#only").checked;let A=P.cards.filter(c=>(!sf||c.sheet===sf)&&(!only||S.has(c.uid)));const out=$("#pages");out.innerHTML="";for(let p=0;p<Math.ceil(A.length/9);p++){const pg=document.createElement("div");pg.className="page"+($("#guides").checked?"":" noguide");A.slice(p*9,p*9+9).forEach(c=>pg.insertAdjacentHTML("beforeend",card(c)));for(let n=pg.children.length;n<9;n++)pg.insertAdjacentHTML("beforeend",'<div class="slot blank"></div>');out.appendChild(pg)}if(!A.length)out.innerHTML='<div class="empty">Нет карточек при текущем фильтре.</div>';out.querySelectorAll(".slot[data-u]").forEach(e=>e.onclick=()=>{S.has(e.dataset.u)?S.delete(e.dataset.u):S.add(e.dataset.u);render()});$("#stat").textContent=`${A.length} карт • ${Math.ceil(A.length/9)} A4 • выбрано ${S.size}`}$("#open").onclick=()=>$("#file").click();$("#file").onchange=async e=>{try{set(JSON.parse(await e.target.files[0].text()))}catch(x){alert(x.message)}};$("#canonical").onclick=async()=>{for(const u of["../../cards/canonical_registry_v5.7.2.json","./canonical_registry_v5.7.2.json"]){try{const r=await fetch(u,{cache:"no-store"});if(r.ok){set(await r.json());return}}catch(e){}}alert("Откройте canonical registry вручную")};$("#sheet").onchange=render;$("#guides").onchange=render;$("#only").onchange=render;$("#all").onclick=()=>{P&&P.cards.forEach(c=>S.add(c.uid));render()};$("#none").onclick=()=>{S.clear();render()};$("#print").onclick=()=>window.print()})()</script></body></html>
